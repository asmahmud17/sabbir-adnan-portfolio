<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design | Anas Mahmud</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --accent: #9333ea;
            --bg-color: #09090b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #f4f4f5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        h1, h2, h3, .bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
        img { pointer-events: none; }
        
        .project-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px -5px rgba(147, 51, 234, 0.5);
        }
        .neon-badge {
            background: rgba(147, 51, 234, 0.1);
            border: 1px solid var(--accent);
            color: #d8b4fe;
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.3);
        }
        
        .filter-btn {
            border: 1px solid #27272a;
            color: #a1a1aa;
            transition: all 0.3s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.3);
            background: rgba(147, 51, 234, 0.1);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <nav class="w-full z-50 bg-[#09090b]/80 border-b border-white/10 sticky top-0 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-zinc-400 hover:text-white transition-colors font-medium">
                <i class="ph ph-arrow-left text-xl"></i> Back to Home
            </a>
            <span class="bebas text-2xl tracking-wider text-white">AM.</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12 min-h-screen">
        <h1 class="text-5xl md:text-6xl text-center mb-8">Graphic Design Projects</h1>
        
        <!-- Filters -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" id="filter-container">
            <button class="filter-btn active px-4 py-2 rounded-full font-medium text-sm" data-filter="all">All</button>
            <!-- Generated via JS -->
        </div>

        <!-- Grid (Masonry effect like approach using flex column or standard grid for designs) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="projects-grid">
            <!-- Generated via JS -->
        </div>
    </main>

    <footer class="border-t border-white/10 py-8 text-center text-zinc-500">
        <p>&copy; 2026 Anas Mahmud. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialCategory = urlParams.get('category');

            const projectsGrid = document.getElementById('projects-grid');
            const filterContainer = document.getElementById('filter-container');

            // Extract unique categories
            const categories = [...new Set(config.designProjects.map(p => p.category))];
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn px-4 py-2 rounded-full font-medium text-sm';
                btn.dataset.filter = cat;
                btn.innerText = cat;
                if(initialCategory === cat) {
                    document.querySelector('.filter-btn.active').classList.remove('active');
                    btn.classList.add('active');
                }
                filterContainer.appendChild(btn);
            });

            function renderProjects(filter) {
                projectsGrid.innerHTML = '';
                const filtered = filter === 'all' ? config.designProjects : config.designProjects.filter(p => p.category === filter);
                
                if (filtered.length === 0) {
                    projectsGrid.innerHTML = '<p class="text-zinc-500 col-span-full text-center py-10">No projects found for this category.</p>';
                    return;
                }

                filtered.forEach(proj => {
                    const div = document.createElement('div');
                    div.className = 'project-card bg-[#18181b] rounded-xl overflow-hidden group';
                    div.innerHTML = `
                        <div class="aspect-[4/5] w-full overflow-hidden relative">
                            <img src="${proj.thumbnail}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" loading="lazy">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <a href="${proj.url}" target="_blank" class="w-12 h-12 rounded-full bg-purple-600 flex items-center justify-center text-white shadow-[0_0_15px_rgba(147,51,234,0.8)] hover:scale-110 transition-transform">
                                    <i class="ph ph-eye text-2xl"></i>
                                </a>
                            </div>
                        </div>
                        <div class="p-6 relative">
                            <span class="absolute -top-3 right-4 neon-badge text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider bg-[#18181b]">
                                ${proj.category}
                            </span>
                            <h3 class="text-2xl mb-2">${proj.title}</h3>
                            <a href="${proj.url}" target="_blank" class="text-purple-400 hover:text-purple-300 text-sm flex items-center gap-1">View Project <i class="ph ph-arrow-up-right"></i></a>
                        </div>
                    `;
                    projectsGrid.appendChild(div);
                });
            }

            renderProjects(initialCategory || 'all');

            // Filter Click Events
            filterContainer.addEventListener('click', (e) => {
                if(e.target.tagName === 'BUTTON') {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    renderProjects(e.target.dataset.filter);
                }
            });
        });
    </script>
</body>
</html>
