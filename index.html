<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Mahmud | Portfolio</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="config.js"></script>

    <style>
        :root {
            --accent: #9333ea;
            --accent-glow: rgba(147, 51, 234, 0.5);
            --green-glow: rgba(34, 197, 94, 0.8);
            --bg-color: #09090b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #f4f4f5;
            overflow-x: hidden;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, h4, h5, h6, .bebas {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1px;
        }

        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }

        /* Protected Mode */
        img, video {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            pointer-events: none; /* disables right click on image directly if we want, but we will handle via JS */
        }
        
        body {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Custom Cursor */
        @media (hover: hover) and (pointer: fine) {
            .cursor-dot {
                width: 6px;
                height: 6px;
                background-color: white;
                position: fixed;
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                transform: translate(-50%, -50%);
                transition: opacity 0.3s;
            }
            .cursor-outline {
                width: 30px;
                height: 30px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                position: fixed;
                border-radius: 50%;
                pointer-events: none;
                z-index: 9998;
                transform: translate(-50%, -50%);
                transition: transform 0.1s, opacity 0.3s;
            }
        }
        @media (max-width: 768px) {
            .cursor-dot, .cursor-outline { display: none; }
        }

        /* GPU Acceleration for all animated elements */
        .fade-slide-up,
        .project-card,
        .carousel-container,
        .carousel-item,
        .neon-badge,
        .section-heading,
        .contact-card,
        .skill-card,
        .nav-link {
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform;
        }

        /* Animations */
        .fade-slide-up {
            opacity: 0;
            transform: translateY(30px) translateZ(0);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-slide-up.visible {
            opacity: 1;
            transform: translateY(0) translateZ(0);
        }

        /* Nav Links Underline */
        .nav-link {
            position: relative;
            display: inline-block;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }

        /* Card Hover */
        .project-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-8px) translateZ(0);
            box-shadow: 0 10px 25px -5px var(--accent-glow);
        }

        /* Section Heading Underline */
        .section-heading {
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }
        .section-heading::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: 0;
            left: 0;
            background-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            transition: width 1s ease-out;
        }
        .section-heading.visible::after {
            width: 100%;
        }

        /* Neon Category Badges */
        .neon-badge {
            background: rgba(147, 51, 234, 0.1);
            border: 1px solid var(--accent);
            color: #d8b4fe;
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.3);
            text-shadow: 0 0 5px rgba(147, 51, 234, 0.5);
            transition: all 0.3s ease;
        }
        .neon-badge:hover {
            background: rgba(147, 51, 234, 0.2);
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.6);
            transform: scale(1.05) translateZ(0);
        }

        /* Carousel — Pure CSS scroll-snap, no JS touch events */
        .carousel-container {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            gap: 16px;
            padding: 2rem 16px;
        }
        
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .carousel-item {
            scroll-snap-align: start;
            flex-shrink: 0;
            width: 80vw;
            max-width: 350px;
        }
        @media (min-width: 768px) {
            .carousel-item {
                width: 400px;
                max-width: 400px;
            }
        }

        /* Skill Proof Cards */
        .status-badge.linked {
            border: 1px solid #22c55e;
            color: #4ade80;
            box-shadow: 0 0 10px var(--green-glow);
        }
        .status-badge.unlinked {
            border: 1px solid #52525b;
            color: #a1a1aa;
        }
        .skill-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        /* Contact Cards */
        .contact-card {
            background: #18181b;
            border: 1px solid #27272a;
            transition: all 0.3s ease;
        }
        .contact-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-5px);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-[#09090b]/80 backdrop-blur-md border-b border-white/10 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#" class="bebas text-2xl tracking-wider text-white hover:text-purple-400 transition-colors" id="nav-name">AM.</a>
            
            <div class="hidden md:flex gap-8 items-center">
                <a href="#video-editing" class="nav-link font-medium">Video</a>
                <a href="#graphic-design" class="nav-link font-medium">Design</a>
                <a href="#skills" class="nav-link font-medium">Skills</a>
                <a href="#contact" class="nav-link font-medium">Contact</a>
            </div>

            <!-- Mobile Menu Btn -->
            <button class="md:hidden text-2xl" id="mobile-menu-btn">
                <i class="ph ph-list"></i>
            </button>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-[#09090b] border-b border-white/10 px-6 py-4 flex-col gap-4">
            <a href="#video-editing" class="block font-medium py-2">Video</a>
            <a href="#graphic-design" class="block font-medium py-2">Design</a>
            <a href="#skills" class="block font-medium py-2">Skills</a>
            <a href="#contact" class="block font-medium py-2">Contact</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="min-h-screen flex items-center justify-center pt-20 px-6 relative overflow-hidden">
        <div class="absolute inset-0 bg-purple-900/20 blur-[150px] rounded-full w-[500px] h-[500px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -z-10"></div>
        <div class="max-w-4xl mx-auto text-center flex flex-col items-center">
            <img src="" id="hero-img" alt="Profile" class="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover border-2 border-purple-500 shadow-[0_0_30px_rgba(147,51,234,0.5)] mb-8 fade-slide-up">
            <h1 class="text-6xl md:text-8xl font-bold mb-4 fade-slide-up" style="transition-delay: 0.1s;" id="hero-name">Name</h1>
            <p class="tagline text-xl md:text-3xl text-zinc-300 mb-6 fade-slide-up" style="transition-delay: 0.2s;" id="hero-tagline">Tagline</p>
            <p class="text-zinc-400 max-w-2xl text-base md:text-lg mb-10 fade-slide-up leading-relaxed" style="transition-delay: 0.3s;" id="hero-bio">Bio</p>
            
            <div class="flex gap-4 fade-slide-up" style="transition-delay: 0.4s;">
                <a href="#video-editing" class="bg-purple-600 hover:bg-purple-500 text-white px-8 py-3 rounded-full font-medium transition-all shadow-[0_0_15px_rgba(147,51,234,0.4)] hover:shadow-[0_0_25px_rgba(147,51,234,0.7)]">View Work</a>
                <a href="#contact" class="border border-purple-500 text-purple-400 hover:bg-purple-500/10 px-8 py-3 rounded-full font-medium transition-all">Contact Me</a>
            </div>
        </div>
    </section>

    <!-- Video Editing Section -->
    <section id="video-editing" class="py-20">
        <div class="pl-6 md:pl-12 mb-10">
            <h2 class="text-5xl md:text-6xl section-heading fade-slide-up">Video Editing</h2>
        </div>
        <div class="carousel-container fade-slide-up" id="video-carousel" style="transition-delay: 0.1s;">
            <!-- Items injected via JS -->
        </div>
        <div class="text-center mt-8">
            <a href="projects.html" class="inline-flex items-center gap-2 text-purple-400 hover:text-purple-300 font-medium transition-colors">
                View All Video Projects <i class="ph ph-arrow-right"></i>
            </a>
        </div>
    </section>

    <!-- Graphic Design Section -->
    <section id="graphic-design" class="py-20">
        <div class="pl-6 md:pl-12 mb-10">
            <h2 class="text-5xl md:text-6xl section-heading fade-slide-up">Graphic Design</h2>
        </div>
        <div class="carousel-container fade-slide-up" id="design-carousel" style="transition-delay: 0.1s;">
            <!-- Items injected via JS -->
        </div>
        <div class="text-center mt-8">
            <a href="design-projects.html" class="inline-flex items-center gap-2 text-purple-400 hover:text-purple-300 font-medium transition-colors">
                View All Design Projects <i class="ph ph-arrow-right"></i>
            </a>
        </div>
    </section>

    <!-- Skill Proof & Channel Links -->
    <section id="skills" class="py-20 px-6 max-w-7xl mx-auto">
        <h2 class="text-4xl md:text-5xl section-heading mb-12 fade-slide-up text-center block w-max mx-auto">Skill Proof & Channel Links</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 fade-slide-up" id="skills-grid" style="transition-delay: 0.1s;">
            <!-- Injected via JS -->
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="py-20 px-6 max-w-7xl mx-auto mb-20">
        <h2 class="text-4xl md:text-5xl section-heading mb-12 fade-slide-up text-center block w-max mx-auto">Let's Work Together</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 fade-slide-up" id="contact-grid" style="transition-delay: 0.1s;">
            <!-- Injected via JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-white/10 py-10 text-center text-zinc-500">
        <p class="bebas text-xl mb-2" id="footer-name"></p>
        <p>&copy; 2026 All rights reserved.</p>
    </footer>

    <script>
        // Init Content from config.js
        document.addEventListener('DOMContentLoaded', () => {
            // Populate basic info
            document.getElementById('nav-name').innerText = config.name.split(' ').map(n=>n[0]).join('') + '.';
            document.getElementById('hero-name').innerText = config.name;
            document.getElementById('hero-tagline').innerText = config.tagline;
            document.getElementById('hero-bio').innerText = config.bio;
            document.getElementById('hero-img').src = config.profileImage;
            document.getElementById('footer-name').innerText = config.name;

            // Helper for category URLs
            const getCategoryUrl = (cat, type) => {
                const page = type === 'video' ? 'projects.html' : 'design-projects.html';
                return `${page}?category=${encodeURIComponent(cat)}`;
            };

            // Populate Video Carousel
            const videoCarousel = document.getElementById('video-carousel');
            config.videoProjects.forEach((proj, index) => {
                const div = document.createElement('div');
                div.className = `carousel-item relative rounded-xl overflow-hidden bg-[#18181b] project-card group ${index === 1 ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="aspect-video w-full overflow-hidden">
                        <img src="${proj.thumbnail}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 pointer-events-none" loading="lazy">
                    </div>
                    <div class="p-5 relative">
                        <a href="${getCategoryUrl(proj.category, 'video')}" class="absolute -top-4 right-4 neon-badge text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider z-10 cursor-pointer">
                            ${proj.category}
                        </a>
                        <h3 class="text-2xl mb-1">${proj.title}</h3>
                        <a href="${proj.url}" target="_blank" class="text-zinc-400 hover:text-purple-400 text-sm flex items-center gap-1 mt-3">Watch Project <i class="ph ph-arrow-up-right"></i></a>
                    </div>
                `;
                videoCarousel.appendChild(div);
            });

            // Populate Design Carousel
            const designCarousel = document.getElementById('design-carousel');
            config.designProjects.forEach((proj, index) => {
                const div = document.createElement('div');
                div.className = `carousel-item relative rounded-xl overflow-hidden bg-[#18181b] project-card group ${index === 1 ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="aspect-[4/5] w-full overflow-hidden">
                        <img src="${proj.thumbnail}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 pointer-events-none" loading="lazy">
                    </div>
                    <div class="p-5 relative">
                        <a href="${getCategoryUrl(proj.category, 'design')}" class="absolute -top-4 right-4 neon-badge text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider z-10 cursor-pointer">
                            ${proj.category}
                        </a>
                        <h3 class="text-2xl mb-1">${proj.title}</h3>
                        <a href="${proj.url}" target="_blank" class="text-zinc-400 hover:text-purple-400 text-sm flex items-center gap-1 mt-3">View Project <i class="ph ph-arrow-up-right"></i></a>
                    </div>
                `;
                designCarousel.appendChild(div);
            });

            // Populate Skills Grid
            const skillsGrid = document.getElementById('skills-grid');
            const skillPlatforms = [
                { name: 'YouTube', icon: 'ph-youtube-logo', id: 'youtube' },
                { name: 'Behance', icon: 'ph-behance-logo', id: 'behance' },
                { name: 'Facebook', icon: 'ph-facebook-logo', id: 'facebook' },
                { name: 'Google Drive', icon: 'ph-google-drive-logo', id: 'googleDrive' },
                { name: 'Telegram', icon: 'ph-telegram-logo', id: 'telegram' },
                { name: 'Instagram', icon: 'ph-instagram-logo', id: 'instagram' },
                { name: 'Email', icon: 'ph-envelope-simple', id: 'email' },
                { name: 'WhatsApp', icon: 'ph-whatsapp-logo', id: 'whatsapp' }
            ];

            skillPlatforms.forEach(plat => {
                const isLinked = config.linksStatus[plat.id];
                const badgeClass = isLinked ? 'linked' : 'unlinked';
                const badgeText = isLinked ? 'Linked' : 'Unlinked';
                const href = isLinked && config.socials[plat.id] !== '#' ? config.socials[plat.id] : 'javascript:void(0)';
                
                const a = document.createElement('a');
                a.href = href;
                if(isLinked) a.target = '_blank';
                a.className = `skill-card bg-[#18181b] border border-[#27272a] rounded-xl p-5 flex flex-col items-center justify-center gap-3 transition-all ${isLinked ? 'cursor-pointer' : 'cursor-default opacity-50'}`;
                
                a.innerHTML = `
                    <i class="ph ${plat.icon} text-4xl text-zinc-300"></i>
                    <span class="font-medium text-lg">${plat.name}</span>
                    <span class="status-badge ${badgeClass} text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold">${badgeText}</span>
                `;
                skillsGrid.appendChild(a);
            });

            // Populate Contact Grid
            const contactGrid = document.getElementById('contact-grid');
            const contacts = [
                { name: 'Email', val: config.socials.email, icon: 'ph-envelope-simple', color: 'text-rose-500', href: `mailto:${config.socials.email}?subject=Project%20Inquiry%20%E2%80%94%20${encodeURIComponent(config.name)}` },
                { name: 'Instagram', val: config.socials.instagram, icon: 'ph-instagram-logo', color: 'text-pink-500', href: config.socials.instagramUrl },
                { name: 'YouTube', val: 'Anas Mahmud', icon: 'ph-youtube-logo', color: 'text-red-500', href: config.socials.youtube },
            ];

            contacts.forEach(c => {
                const a = document.createElement('a');
                a.href = c.href;
                a.target = '_blank';
                a.className = 'contact-card rounded-2xl p-8 flex flex-col items-center justify-center gap-4 text-center group cursor-pointer';
                a.innerHTML = `
                    <div class="w-16 h-16 rounded-full bg-[#27272a] flex items-center justify-center group-hover:scale-110 transition-transform">
                        <i class="ph ${c.icon} text-3xl ${c.color}"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl mb-1">${c.name}</h3>
                        <p class="text-zinc-400 font-medium">${c.val}</p>
                    </div>
                `;
                contactGrid.appendChild(a);
            });

            // Mobile Menu Toggle
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            mobileBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                mobileMenu.classList.toggle('flex');
            });
            mobileMenu.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', () => {
                    mobileMenu.classList.add('hidden');
                    mobileMenu.classList.remove('flex');
                });
            });

            initAnimations();
            initCustomCursor();
        });

        // Custom Cursor Logic
        function initCustomCursor() {
            const dot = document.querySelector('.cursor-dot');
            const outline = document.querySelector('.cursor-outline');
            if(!dot || !outline) return;

            window.addEventListener('mousemove', (e) => {
                const posX = e.clientX;
                const posY = e.clientY;

                dot.style.left = `${posX}px`;
                dot.style.top = `${posY}px`;

                // Slight delay for outline
                outline.animate({
                    left: `${posX}px`,
                    top: `${posY}px`
                }, { duration: 500, fill: "forwards" });
            });

            // Hover effects
            const interactables = document.querySelectorAll('a, button, .carousel-container');
            interactables.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    outline.style.transform = 'translate(-50%, -50%) scale(1.5)';
                    outline.style.backgroundColor = 'rgba(147, 51, 234, 0.1)';
                    outline.style.borderColor = 'rgba(147, 51, 234, 0.5)';
                });
                el.addEventListener('mouseleave', () => {
                    outline.style.transform = 'translate(-50%, -50%) scale(1)';
                    outline.style.backgroundColor = 'transparent';
                    outline.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                });
            });
        }

        // Intersection Observer for fade/slide and neon underline animations
        function initAnimations() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.fade-slide-up, .section-heading').forEach(el => {
                observer.observe(el);
            });
        }


        // Prevent dragging on images
        document.addEventListener('dragstart', (e) => {
            if(e.target.nodeName === 'IMG' || e.target.nodeName === 'A') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
